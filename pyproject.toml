[build-system]
requires = ["setuptools >= 84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yeast = ["../assets/*"]

[project]
name = "pyyeast"
version = "0.1.0"
requires-python = ">=3.12"
authors = [
    {name = "Alessio Parolini", email = "alepar.ap9@gmail.com"}
]
description = "PyYeast - A Python library, based on PyTorch, to build and manage, for now (I'm in the Beta version), self-expanding linear layers."
readme = "README.md"
dependencies = [
    "torch==2.14.1",
    "numpy===2.1.0",
]
